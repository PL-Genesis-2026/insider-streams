type EventCreated @entity(immutable: true) {
  id: Bytes!
  eventId: BigInt! # uint256
  creator: Bytes! # address
  question: String! # string
  eventOpen: BigInt! # uint256
  eventClose: BigInt! # uint256
  duration: BigInt! # uint256
  yesToken: Bytes! # address
  noToken: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ExpectedAuthorUpdated @entity(immutable: true) {
  id: Bytes!
  previousAuthor: Bytes! # address
  newAuthor: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ExpectedWorkflowIdUpdated @entity(immutable: true) {
  id: Bytes!
  previousId: Bytes! # bytes32
  newId: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ExpectedWorkflowNameUpdated @entity(immutable: true) {
  id: Bytes!
  previousName: Bytes! # bytes10
  newName: Bytes! # bytes10
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ForwarderAddressUpdated @entity(immutable: true) {
  id: Bytes!
  previousForwarder: Bytes! # address
