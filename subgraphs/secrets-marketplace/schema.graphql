type AuctionClosed @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  winningBid: BigInt! # uint64
  sellerId: String! # string
  eventId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AuctionClosePending @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  sellerId: String! # string
  eventId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AuctionCreated @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  eventId: BigInt! # uint256
  sellerId: String! # string
  eventTitle: String! # string
  endTime: BigInt! # uint256
  secretDataCid: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AuctionCancelled @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  sellerId: String! # string
  eventId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type BidPlaced @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  bidAmount: BigInt! # uint64
  previousBid: BigInt! # uint64
  auction: Auction # FK for @derivedFrom on Auction.bids
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type DepositedFor @entity(immutable: true) {
  id: Bytes!
  userId: String! # pseudonymous user ID
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type WithdrawnFor @entity(immutable: true) {
  id: Bytes!
  userId: String! # pseudonymous user ID
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ExternalEventResolved @entity(immutable: true) {
  id: Bytes!
  externalEventId: BigInt! # uint256
  auctionsAffected: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type OwnershipTransferred @entity(immutable: true) {
  id: Bytes!
  previousOwner: Bytes! # address
  newOwner: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SellerReputationScoreUpdated @entity(immutable: true) {
  id: Bytes!
  sellerId: String! # string
  auctionId: BigInt! # uint256
  predictionOutcome: Int! # uint8 (PredictionOutcome enum)
  scoreChange: Int! # int8
  newScore: BigInt! # int256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SellerRegistered @entity(immutable: true) {
  id: Bytes!
  sellerId: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SettlerUpdated @entity(immutable: true) {
  id: Bytes!
  previousSettler: Bytes! # address
  newSettler: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AuctionAdminExpired @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

enum AuctionStatus {
  Open
  Closed
  Cancelled
}

type Seller @entity(immutable: false) {
  id: String!
  sellerId: String!
  reputationScore: BigInt!
  totalAuctionCount: Int!
  openAuctionCount: Int!
  auctionsWithCorrectPredictionsCount: Int!
  auctionsWithWrongPredictionsCount: Int!
  unscorableAuctionCount: Int!
  totalEarnings: BigInt!
  auctions: [Auction!]! @derivedFrom(field: "seller")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Auction @entity(immutable: false) {
  id: String!
  auctionId: BigInt!
  eventId: BigInt!
  sellerId: String!
  seller: Seller!
  eventTitle: String!
  endTime: BigInt!
  secretDataCid: Bytes!
  bidCount: Int!
  currentBid: BigInt!
  status: AuctionStatus!
  predictionOutcome: Int
  scoreChange: Int
  bids: [BidPlaced!]! @derivedFrom(field: "auction")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type EventAdminClosed @entity(immutable: true) {
  id: Bytes!
  eventId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type EventCreated @entity(immutable: true) {
  id: Bytes!
  eventId: BigInt! # uint256
  creator: Bytes! # address
  question: String! # string
  eventOpen: BigInt! # uint256
  eventClose: BigInt! # uint256
  duration: BigInt! # uint256
  yesToken: Bytes! # address
  noToken: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type LiquidityWithdrawn @entity(immutable: true) {
  id: Bytes!
  eventId: BigInt! # uint256
  creator: Bytes! # address
  usdcOut: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SettlementRequested @entity(immutable: true) {
  id: Bytes!
  eventId: BigInt! # uint256
  question: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SettlementResponse @entity(immutable: true) {
  id: Bytes!
  eventId: BigInt! # uint256
