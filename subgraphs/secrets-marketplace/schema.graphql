type AuctionClosed @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  buyer: Bytes! # address
  winningBid: BigInt! # uint256
  seller: Bytes! # address
  externalMarketId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AuctionCreated @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  seller: Bytes! # address
  externalMarketId: BigInt! # uint256
  reservePrice: BigInt! # uint256
  endTime: BigInt! # uint256
  betOnYes: Boolean! # bool
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AuctionForceClosed @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  refundedBidder: Bytes! # address
  refundAmount: BigInt! # uint256
  seller: Bytes! # address
  externalMarketId: BigInt! # uint256
  reputationDelta: Int! # int8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type BidPlaced @entity(immutable: true) {
  id: Bytes!
  auctionId: BigInt! # uint256
  bidder: Bytes! # address
  bidAmount: BigInt! # uint256
  automaticBetAmount: BigInt! # uint256
  previousBidder: Bytes! # address
  previousBid: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

