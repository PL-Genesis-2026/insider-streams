specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FHESecretMarketplace
    network: sepolia
    source:
      address: "0xf74884348F7153c63A46a1e362ec6D90E754Cf15"
      abi: FHESecretMarketplace
      startBlock: 10428300
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AuctionClosed
        - AuctionClosePending
        - AuctionCreated
        - AuctionCancelled
        - AuctionAdminExpired
        - BidPlaced
        - DepositedFor
        - WithdrawnFor
        - ExternalEventResolved
        - OwnershipTransferred
        - SellerReputationScoreUpdated
        - SellerRegistered
        - SettlerUpdated
        - Auction
        - Seller
      abis:
        - name: FHESecretMarketplace
          file: ./abis/FHESecretMarketplace.json
      eventHandlers:
        - event: AuctionClosed(indexed uint256,uint64,string,uint256)
          handler: handleAuctionClosed
        - event: AuctionCreated(indexed uint256,indexed uint256,string,string,uint256,bytes32)
          handler: handleAuctionCreated
        - event: AuctionCancelled(indexed uint256,string,uint256)
          handler: handleAuctionCancelled
        - event: AuctionClosePending(indexed uint256,string,uint256)
          handler: handleAuctionClosePending
        - event: BidPlaced(indexed uint256,uint64,uint64)
          handler: handleBidPlaced
        - event: DepositedFor(string)
          handler: handleDepositedFor
        - event: WithdrawnFor(string)
          handler: handleWithdrawnFor
        - event: ExternalEventResolved(indexed uint256,uint256)
          handler: handleExternalEventResolved
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: SellerReputationScoreUpdated(string,indexed uint256,uint8,int8,int256)
          handler: handleSellerReputationScoreUpdated
        - event: SellerRegistered(string)
          handler: handleSellerRegistered
        - event: SettlerUpdated(indexed address,indexed address)
          handler: handleSettlerUpdated
        - event: AuctionAdminExpired(indexed uint256)
          handler: handleAuctionAdminExpired
      file: ./src/secret-marketplace.ts
  - kind: ethereum
    name: ExamplePredictionMarket
    network: sepolia
    source:
      address: "0x7C22C1b9B2a4575089a996E98c877b996eBbBAA2"
      abi: ExamplePredictionMarket
      startBlock: 10428299
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - EventAdminClosed
        - EventCreated
        - LiquidityWithdrawn
        - SettlementRequested
        - SettlementResponse
        - SharesPurchased
        - SharesRedeemed
      abis:
        - name: ExamplePredictionMarket
          file: ./abis/ExamplePredictionMarket.json
      eventHandlers:
        - event: EventCreated(indexed uint256,indexed
            address,string,uint256,uint256,uint256,address,address)
          handler: handleEventCreated
        - event: LiquidityWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleLiquidityWithdrawn
        - event: SettlementRequested(indexed uint256,string)
          handler: handleSettlementRequested
        - event: SettlementResponse(indexed uint256,indexed uint8,indexed uint8)
          handler: handleSettlementResponse
        - event: SharesPurchased(indexed uint256,indexed address,indexed uint8,uint256,uint256)
          handler: handleSharesPurchased
        - event: SharesRedeemed(indexed uint256,indexed address,uint256,uint256)
          handler: handleSharesRedeemed
        - event: EventAdminClosed(indexed uint256)
          handler: handleEventAdminClosed
      file: ./src/example-prediction-market.ts
