query HomepageAuctions(
  $limit: Int!
  $skip: Int!
  $where: Auction_filter
) {
  auctions(
    first: $limit
    skip: $skip
    orderBy: blockTimestamp
    orderDirection: desc
    where: $where
  ) {
    auctionId
    sellerId
    eventId
    eventTitle
    endTime
    currentBid
    bidCount
    status
    seller {
      reputationScore
      totalAuctionCount
      auctionsWithCorrectPredictionsCount
      auctionsWithWrongPredictionsCount
    }
  }
}
