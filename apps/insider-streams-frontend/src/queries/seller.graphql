query SellerDetail($sellerId: ID!) {
  seller(id: $sellerId) {
    sellerId
    reputationScore
    totalAuctionCount
    openAuctionCount
    auctionsWithCorrectPredictionsCount
    auctionsWithWrongPredictionsCount
    unscorableAuctionCount
    totalEarnings
    auctions(orderBy: blockTimestamp, orderDirection: desc) {
      auctionId
      eventId
      eventTitle
      endTime
      bidCount
      currentBid
      status
      predictionOutcome
      scoreChange
      blockTimestamp
    }
  }
}
