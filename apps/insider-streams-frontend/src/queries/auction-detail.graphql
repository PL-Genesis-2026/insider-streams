query AuctionDetailSubgraph($auctionId: BigInt!, $bidLimit: Int!) {
  createdAuction: auctionCreateds(
    first: 1
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    auctionId
    sellerId
    eventId
    endTime
    blockTimestamp
  }
  bids: bidPlaceds(
    first: $bidLimit
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    bidAmount
    previousBid
    blockTimestamp
    transactionHash
  }
  closedAuction: auctionCloseds(
    first: 1
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    sellerId
    winningBid
    eventId
    blockTimestamp
  }
  cancelledAuction: auctionCancelleds(
    first: 1
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    sellerId
    cancelledBidAmount
    eventId
    blockTimestamp
  }
  reputationUpdates: sellerReputationScoreUpdateds(
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    predictionOutcome
    scoreChange
    newScore
    blockTimestamp
  }
}
