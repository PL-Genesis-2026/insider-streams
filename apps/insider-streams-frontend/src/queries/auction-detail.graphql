query AuctionDetailSubgraph($auctionId: BigInt!, $bidLimit: Int!) {
  createdAuction: auctionCreateds(
    first: 1
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    auctionId
    sellerId
    eventId
    eventTitle
    endTime
    blockTimestamp
  }
  bids: bidPlaceds(
    first: $bidLimit
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    bidAmount
    previousBid
    blockTimestamp
    transactionHash
  }
  closedAuction: auctionCloseds(
    first: 1
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    sellerId
    winningBid
    eventId
    blockTimestamp
  }
  forceClosedAuction: auctionForceCloseds(
    first: 1
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    sellerId
    heldAmount
    eventId
    reputationDelta
    blockTimestamp
  }
  reputationUpdates: reputationUpdateds(
    orderBy: blockTimestamp
    orderDirection: desc
    where: { auctionId: $auctionId }
  ) {
    reputationDelta
    newScore
    blockTimestamp
  }
}
