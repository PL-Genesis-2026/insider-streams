# ==========================================================================
# CRE WORKFLOW SETTINGS FILE — deposit-reconciler
# ==========================================================================
# Polls the Private Token API for incoming transfers to the platform EOA
# and records them as deposits in Supabase.

# ==========================================================================
local-simulation:
  user-workflow:
    workflow-name: "deposit-reconciler"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
staging:
  user-workflow:
    workflow-name: "deposit-reconciler"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: "../secrets.yaml"
